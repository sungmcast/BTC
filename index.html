<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국내 거래소 코인 시세 비교</title>
<meta name="description" content="업비트·빗썸·코인원 3개 거래소의 실시간 원화 코인 시세를 한 눈에 비교합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F3;
    --panel:#FBFCFC;
    --ink:#161B1F;
    --ink-soft:#565F66;
    --ink-faint:#8B949B;
    --line:#D6DBDE;
    --line-strong:#161B1F;
    --house:#223046;
    --up:#1E7645;
    --up-tint:#E4F1E9;
    --down:#B23B3B;
    --down-tint:#F7E7E7;
    --gap-tint:#FBF0DD;
    --gap:#93630D;
    --maxw:960px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px;}

  .masthead{border-bottom:2px solid var(--line-strong);padding:28px 0 18px;}
  .masthead .row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
  .masthead h1{
    font-family:'Newsreader',serif;font-weight:600;font-style:italic;
    font-size:30px;margin:0;letter-spacing:0.002em;
  }
  .masthead .sub{font-size:13px;color:var(--ink-faint);margin-top:6px;}
  .masthead .meta{text-align:right;font-size:12.5px;color:var(--ink-faint);}
  .masthead .meta .updated{color:var(--ink-soft);font-weight:500;}
  .refresh-btn{
    margin-top:8px;background:var(--house);color:#fff;border:none;
    font-size:12.5px;font-weight:600;padding:7px 14px;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .refresh-btn:hover{background:#182335;}
  .refresh-btn:disabled{opacity:0.5;cursor:default;}

  .controls{display:flex;justify-content:space-between;align-items:center;padding:16px 0;gap:12px;flex-wrap:wrap;}
  .search{
    flex:1;min-width:180px;border:1px solid var(--line);background:var(--panel);
    padding:9px 12px;font-size:14px;font-family:'Inter',sans-serif;color:var(--ink);
  }
  .search:focus{outline:none;border-color:var(--house);}
  .currency-note{font-size:12px;color:var(--ink-faint);white-space:nowrap;}

  .exchange-status{
    display:flex;gap:14px;font-size:12px;color:var(--ink-faint);
    padding-bottom:12px;flex-wrap:wrap;
  }
  .exchange-status span.dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    margin-right:5px;background:var(--up);
  }
  .exchange-status span.dot.fail{background:var(--down);}
  .exchange-status span.dot.loading{background:var(--ink-faint);}

  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:620px;}
  thead th{
    text-align:left;font-size:11.5px;letter-spacing:0.02em;color:var(--ink-faint);
    font-weight:600;padding:0 6px 8px;border-bottom:1px solid var(--line-strong);
  }
  thead th.num-col{text-align:right;}
  tbody td{padding:13px 6px;border-bottom:1px solid var(--line);font-size:14px;}
  tbody tr:hover{background:var(--panel);}
  tbody td.num-col{text-align:right;}

  .coin-cell{font-weight:500;}
  .coin-cell .sym{font-weight:600;}
  .coin-cell .kr-name{color:var(--ink-faint);font-size:12px;margin-left:7px;font-weight:400;}
  .price{font-weight:600;}
  .price .won{font-weight:400;font-size:11.5px;color:var(--ink-faint);margin-left:2px;font-family:'Inter',sans-serif;}
  .price.missing{color:var(--ink-faint);font-weight:400;}
  .change{font-size:12.5px;padding:2px 6px;border-radius:2px;margin-left:6px;}
  .change.up{color:var(--up);background:var(--up-tint);}
  .change.down{color:var(--down);background:var(--down-tint);}
  .gap-badge{
    font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:2px;
    color:var(--gap);background:var(--gap-tint);
  }

  .status{padding:40px 0;text-align:center;color:var(--ink-faint);font-size:14px;}
  .status.error{color:var(--down);}

  footer{padding:22px 0 60px;font-size:12px;color:var(--ink-faint);border-top:1px solid var(--line);margin-top:20px;}

  @media (max-width:600px){
    .masthead h1{font-size:24px;}
    tbody td{font-size:13px;padding:12px 4px;}
    thead th{font-size:10px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <div class="row">
      <div>
        <h1>국내 거래소 코인 시세 비교</h1>
        <div class="sub" id="subtitle">업비트 거래대금 상위 100개 · 빗썸·코인원 동시 비교 · KRW 기준</div>
      </div>
      <div class="meta">
        <div>마지막 갱신</div>
        <div class="updated" id="updatedAt">불러오는 중…</div>
        <button class="refresh-btn" id="refreshBtn">지금 새로고침</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="currency-note">시가총액 1~100위 · 60초마다 자동 갱신</div>
  </div>

  <div class="exchange-status" id="exchangeStatus">
    <span><span class="dot loading" id="dotUpbit"></span>업비트</span>
    <span><span class="dot loading" id="dotBithumb"></span>빗썸</span>
    <span><span class="dot loading" id="dotCoinone"></span>코인원</span>
  </div>

  <div class="table-scroll" id="tableContainer">
    <div class="status" id="statusMsg">시세를 불러오는 중입니다…</div>
  </div>

  <footer>
    데이터 제공: 업비트·빗썸·코인원 공개 API (지연 가능성 있음) · 표시된 "차이"는 세 거래소 중 최고가와 최저가의 격차입니다 · 투자 판단의 근거로 사용하지 마세요.
  </footer>
</div>

<script>
(function(){
  const REFRESH_MS = 60000;
  const TOP_N = 100;

  const els = {
    table: document.getElementById("tableContainer"),
    updatedAt: document.getElementById("updatedAt"),
    refreshBtn: document.getElementById("refreshBtn"),
    subtitle: document.getElementById("subtitle"),
    dotUpbit: document.getElementById("dotUpbit"),
    dotBithumb: document.getElementById("dotBithumb"),
    dotCoinone: document.getElementById("dotCoinone"),
  };

  let rows = [];
  let isLoading = false;

  function setDot(el, state){
    el.className = "dot " + (state === "ok" ? "" : state === "fail" ? "fail" : "loading");
  }

  function formatKRW(n){
    if(n === null || n === undefined || isNaN(n)) return null;
    if(n >= 1) return Math.round(n).toLocaleString("ko-KR");
    return n.toLocaleString("ko-KR", {maximumSignificantDigits:4});
  }

  // 업비트 KRW 마켓 전체 시세 (가격, 변동률, 거래대금)
  async function fetchUpbitAll(){
    const res = await fetch("https://api.upbit.com/v1/ticker/all?quote_currencies=KRW");
    if(!res.ok) throw new Error("업비트 시세 오류 " + res.status);
    const data = await res.json();
    return data.map(t => ({
      symbol: t.market.replace("KRW-", ""),
      market: t.market,
      price: t.trade_price,
      change: t.signed_change_rate * 100,
      volume: t.acc_trade_price_24h || 0,
    }));
  }

  // 업비트 마켓별 한글 이름
  async function fetchUpbitNames(){
    const res = await fetch("https://api.upbit.com/v1/market/all?isDetails=false");
    if(!res.ok) throw new Error("업비트 마켓 목록 오류 " + res.status);
    const data = await res.json();
    const map = {};
    data.forEach(m => {
      if(m.market.startsWith("KRW-")) map[m.market.replace("KRW-", "")] = m.korean_name;
    });
    return map;
  }

  // 글로벌 시가총액 순위 (심볼만, 순위 결정용)
  async function fetchMarketCapRanking(){
    const res = await fetch("https://api.coingecko.com/api/v3/coins/markets?vs_currency=krw&order=market_cap_desc&per_page=150&page=1&sparkline=false");
    if(!res.ok) throw new Error("시가총액 순위 오류 " + res.status);
    const data = await res.json();
    return data.map(c => c.symbol.toUpperCase());
  }

  async function fetchBithumb(marketCodes){
    const res = await fetch("https://api.bithumb.com/v1/ticker?markets=" + marketCodes.join(","));
    if(!res.ok) throw new Error("빗썸 응답 오류 " + res.status);
    const data = await res.json();
    const map = {};
    data.forEach(t => { map[t.market.replace("KRW-", "")] = t.trade_price; });
    return map;
  }

  async function fetchCoinone(){
    const target = "https://api.coinone.co.kr/public/v2/ticker_new/KRW";
    let res;
    try {
      res = await fetch(target);
      if(!res.ok) throw new Error("직접 호출 실패");
    } catch(directErr){
      // 브라우저에서 코인원 직접 호출이 CORS로 막히는 경우, 공개 프록시를 거쳐 재시도
      res = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(target));
      if(!res.ok) throw new Error("코인원 응답 오류 " + res.status);
    }
    const data = await res.json();
    const map = {};
    (data.tickers || []).forEach(t => { map[t.target_currency.toUpperCase()] = parseFloat(t.last); });
    return map;
  }

  function render(){
    const filtered = rows;

    if(filtered.length === 0){
      els.table.innerHTML = '<div class="status">불러온 코인이 없습니다.</div>';
      return;
    }

    let html = '<table><thead><tr>' +
      '<th>#</th>' +
      '<th>코인</th>' +
      '<th class="num-col">업비트</th>' +
      '<th class="num-col">빗썸</th>' +
      '<th class="num-col">코인원</th>' +
      '<th class="num-col">거래소 간 차이</th>' +
      '</tr></thead><tbody>';

    filtered.forEach((r, i) => {
      const prices = [r.upbit, r.bithumb, r.coinone].filter(p => p !== null && p !== undefined);
      let gapHtml = '<span class="price missing">-</span>';
      if(prices.length >= 2){
        const max = Math.max(...prices);
        const min = Math.min(...prices);
        const gapPct = ((max - min) / min) * 100;
        gapHtml = '<span class="gap-badge">' + gapPct.toFixed(2) + '%</span>';
      }

      const changeClass = r.change >= 0 ? "up" : "down";
      const changeSign = r.change >= 0 ? "+" : "";

      const cell = (val) => {
        const f = formatKRW(val);
        return f ? '<span class="price num">' + f + '<span class="won">원</span></span>' : '<span class="price missing">-</span>';
      };

      html += `<tr>
        <td class="num">${i + 1}</td>
        <td class="coin-cell"><span class="sym">${r.symbol}</span><span class="kr-name">${r.name || ""}</span></td>
        <td class="num-col">${cell(r.upbit)}<span class="change ${changeClass}">${changeSign}${r.change.toFixed(1)}%</span></td>
        <td class="num-col">${cell(r.bithumb)}</td>
        <td class="num-col">${cell(r.coinone)}</td>
        <td class="num-col">${gapHtml}</td>
      </tr>`;
    });

    html += "</tbody></table>";
    els.table.innerHTML = html;
  }

  async function loadAll(){
    if(isLoading) return; // 중복/겹침 실행 방지 (새로고침 버그 원인)
    isLoading = true;
    els.refreshBtn.disabled = true;
    els.refreshBtn.textContent = "갱신 중…";
    setDot(els.dotUpbit, "loading");
    setDot(els.dotBithumb, "loading");
    setDot(els.dotCoinone, "loading");

    try {
      let upbitAll, namesMap;
      try {
        [upbitAll, namesMap] = await Promise.all([fetchUpbitAll(), fetchUpbitNames()]);
        setDot(els.dotUpbit, "ok");
      } catch(err){
        setDot(els.dotUpbit, "fail");
        els.table.innerHTML = '<div class="status error">업비트 시세를 불러오지 못해 목록을 구성할 수 없습니다. 잠시 후 다시 시도해 주세요.</div>';
        return;
      }

      const upbitMap = {};
      upbitAll.forEach(r => { upbitMap[r.symbol] = r; });

      let symbols, rankingMode;
      try {
        const ranked = await fetchMarketCapRanking();
        const seen = new Set();
        symbols = [];
        for(const s of ranked){
          if(upbitMap[s] && !seen.has(s)){ symbols.push(s); seen.add(s); }
          if(symbols.length >= TOP_N) break;
        }
        rankingMode = "marketcap";
      } catch(err){
        symbols = upbitAll.slice().sort((a,b) => b.volume - a.volume).slice(0, TOP_N).map(r => r.symbol);
        rankingMode = "volume";
      }

      els.subtitle.textContent = rankingMode === "marketcap"
        ? "글로벌 시가총액 1~" + symbols.length + "위 · 빗썸·코인원 동시 비교 · KRW 기준"
        : "시가총액 정보를 불러오지 못해 업비트 거래대금 순으로 대체 표시 중 · KRW 기준";

      const marketCodes = symbols.map(s => "KRW-" + s);

      const [bithumbResult, coinoneResult] = await Promise.allSettled([
        fetchBithumb(marketCodes),
        fetchCoinone(),
      ]);

      const bithumbMap = bithumbResult.status === "fulfilled" ? bithumbResult.value : {};
      const coinoneMap = coinoneResult.status === "fulfilled" ? coinoneResult.value : {};
      setDot(els.dotBithumb, bithumbResult.status === "fulfilled" ? "ok" : "fail");
      setDot(els.dotCoinone, coinoneResult.status === "fulfilled" ? "ok" : "fail");

      rows = symbols.map(s => ({
        symbol: s,
        name: namesMap[s] || "",
        change: upbitMap[s]?.change ?? 0,
        upbit: upbitMap[s]?.price ?? null,
        bithumb: bithumbMap[s] ?? null,
        coinone: coinoneMap[s] ?? null,
      }));

      els.updatedAt.textContent = new Date().toLocaleTimeString("ko-KR");
      render();
    } finally {
      isLoading = false;
      els.refreshBtn.disabled = false;
      els.refreshBtn.textContent = "지금 새로고침";
    }
  }

  els.refreshBtn.addEventListener("click", loadAll);

  loadAll();
  setInterval(loadAll, REFRESH_MS);
})();
</script>

</body>
</html>
